# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Improved scrolling
set -g history-limit 10000

# Copy mode improvements
setw -g mode-keys vi

# Better copy/paste keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Copy to system clipboard (requires xclip on Linux or pbcopy on macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
# For macOS, use this instead:
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste from clipboard
bind-key p run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"
# For macOS, use this instead:
# bind-key p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"

# Enter copy mode with prefix + [
bind [ copy-mode

# Quick copy mode with prefix + v
bind v copy-mode

# Direct scroll bindings (without entering copy mode)
bind -n S-Up send-keys -X -N 3 scroll-up
bind -n S-Down send-keys -X -N 3 scroll-down
bind -n S-PageUp send-keys -X -N 10 scroll-up
bind -n S-PageDown send-keys -X -N 10 scroll-down

# Scroll up/down with mouse wheel (already enabled with mouse on, but explicit for clarity)
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# Better paste buffer management
bind-key b list-buffers
bind-key P choose-buffer

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# Open new panes and windows in the same directory as current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Set default terminal mode to 256color mode
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

# Keep sessions alive after reboot (tmux-resurrect + tmux-continuum)
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Cycle through windows with Ctrl-Tab and Ctrl-Shift-Tab
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits
# (requires vim-tmux-navigator plugin in vim/nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# Vim-aware scroll bindings (enter copy mode and scroll in one action)
bind-key -n 'C-u' if-shell "$is_vim" 'send-keys C-u' 'copy-mode; send-keys -X -N 10 scroll-up'
bind-key -n 'C-d' if-shell "$is_vim" 'send-keys C-d' 'copy-mode; send-keys -X -N 10 scroll-down'

# Copy-mode specific bindings (work when already in copy mode)
bind-key -T copy-mode-vi 'C-u' send-keys -X -N 10 scroll-up
bind-key -T copy-mode-vi 'C-d' send-keys -X -N 10 scroll-down

# Use Escape to exit copy mode (standard vim-style behavior)
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Bind tmux-sessionx to prefix + o (or change to your preference)
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-bind-kill-session 'ctrl-x'

# Catppuccin theme configuration
set -g @catppuccin_flavour 'mocha' # or latte, frappe, macchiato
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Catppuccin theme configuration for omerxx fork
# set -g @catppuccin_flavour 'mocha'
# set -g @catppuccin_status_modules_right "application session"
# set -g @catppuccin_status_fill "icon"

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
